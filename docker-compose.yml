services:
  db:
    image: mysql:5.7
    container_name: stockcontrol-db
    command:
      # O hbm2ddl cria as tabelas sem declarar charset, então o padrão do
      # servidor define a codificacao. Sem isso as tabelas nascem em latin1 e
      # os acentos ficam corrompidos.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockcontrol-ifce
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  app:
    build: .
    container_name: stockcontrol-app
    environment:
      # Popula o banco com dados fictícios quando as tabelas estão vazias.
      # Use "false" para iniciar com o banco em branco.
      APP_SEED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
